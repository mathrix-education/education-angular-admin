name: Build Project
on:
  push:
    branches:
      - master
jobs:
  deploy:
    name: Deploy on Google Cloud Run
    needs: docker
    runs-on: ubuntu-latest
    steps:
      # Extract the branch name from the reference
      # Source: https://stackoverflow.com/a/58035262
      - name: Extract branch name
        id: extract_branch
        shell: bash
        run: |
          SHA = "${{ github.sha }}"
          REF = "${{ github.base_ref }}"
          BASE = "${{ github.head_ref }}"
          echo SHA
          echo REF
          echo BASE
