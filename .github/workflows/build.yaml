name: Build Project
on:
  push:
    branches:
      - dev
jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    strategy:
      matrix:
        branches:
          - dev
          - master
    steps:
      - name: Setup gcloud
        uses: mathrix-education/setup-gcloud@master
        with:
          project: mathrix-education
          service-acount-key:  ${{secrets.GCLOUD_AUTH }}
          configure-docker: true
      - name: debug
        run: gcloud config list account --format "value(core.account)"
      - name: Checkout sources
        uses: actions/checkout@v1
      - name: Setup Node.js 12.x
        uses: actions/setup-node@v1
        with:
          node-version: 12.x
          registry-url: 'https://npm.pkg.github.com'
      - uses: actions/cache@v1
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-
      - name: Install dependencies
        env:
          NODE_AUTH_TOKEN: ${{ secrets.REGISTRY_TOKEN }}
        run: npm install
      - name: build
        run: |
          SHA="${{ github.sha }}"
          REF="${{ matrix.branches }}"
          SHORT_SHA="${SHA:0:7}"
          echo "${SHORT_SHA}"
          BUILD="${REF}-${SHA}"
          npm run ng:browser:${REF}
      - name: Build Docker
        run: docker build -t eu.gcr.io/mathrix-education/education-angular-admin:${GITHUB_SHA:0:7} .
      - name: Push image to Google Cloud Container Registry
        run: docker push eu.gcr.io/mathrix-education/education-angular-admin:${GITHUB_SHA:0:7}
      - name: Deploy To Google Cloud
        if: matrix.branches == 'dev'
        run: |
          gcloud beta run deploy education-angular-admin \
            --image eu.gcr.io/mathrix-education/education-angular-admin:$(printenv GITHUB_SHA | head -c 7) \
            --platform=managed \
            --region=europe-west1 \
            --allow-unauthenticated \
            --set-env-vars="APP_ENV=dev,APP_BUILD=$(printenv GITHUB_SHA | head -c 7)"
