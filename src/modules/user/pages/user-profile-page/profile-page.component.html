<mat-toolbar color="primary">
    <mat-icon (click)="back()">arrow_back</mat-icon>
  <span *ngIf="user$ | async as user">Utilisateur {{user.id}} <{{user.email}}></span>
</mat-toolbar>

<div class="px-2" fxLayout="row" fxLayoutGap="16px">
  <div fxFlex="grow" fxLayout="column" fxLayoutGap="16px">
    <app-admin-user-infos class="panel"></app-admin-user-infos>
    <app-admin-user-actions class="panel"></app-admin-user-actions>
  </div>

  <div fxFlex="30%" fxLayout="column" fxLayoutGap="16px">
    <div fxLayout="row" fxLayoutGap="16px">
    <app-stripe-user fxFlex="50%" class="panel"></app-stripe-user>-
      <app-braintree-user fxFlex="50%" class="panel"></app-braintree-user>
    </div>

    <app-subscriptions-list class="panel"></app-subscriptions-list>
    <app-admin-user-purchases-list class="panel"></app-admin-user-purchases-list>
  </div>
</div>
