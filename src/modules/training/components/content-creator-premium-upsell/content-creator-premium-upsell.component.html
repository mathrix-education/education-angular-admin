<app-rest-editor [dataSource]="dataSource"
                 [policy]="policy"
                 [displayedColumns]="displayedColumns"
                 (add)="startAdd()" (edit)="startEdit($event)" (delete)="delete($event)">
  <!-- name column -->
  <ng-container matColumnDef="name">
    <mat-header-cell *matHeaderCellDef>Nom</mat-header-cell>
    <mat-cell *matCellDef="let element"> {{element.name}} </mat-cell>
  </ng-container>

  <!-- slug column -->
  <ng-container matColumnDef="slug">
    <mat-header-cell *matHeaderCellDef>Url</mat-header-cell>
    <mat-cell *matCellDef="let element"> {{element.slug }}</mat-cell>
  </ng-container>

  <!-- description column -->
  <ng-container matColumnDef="description">
    <mat-header-cell *matHeaderCellDef>Description</mat-header-cell>
    <mat-cell *matCellDef="let element"> {{element.description }}</mat-cell>
  </ng-container>


  <!-- Price column -->
  <ng-container matColumnDef="price">
    <mat-header-cell *matHeaderCellDef>Prix</mat-header-cell>
    <mat-cell *matCellDef="let element"> {{element.price|price}}</mat-cell>
  </ng-container>

  <!-- product column -->
  <ng-container matColumnDef="premium">
    <mat-header-cell *matHeaderCellDef>Premium</mat-header-cell>
    <mat-cell *matCellDef="let element">
      <mat-icon *ngIf="element.type === 'premium'"></mat-icon>
    </mat-cell>
  </ng-container>

  <!-- buyable column -->
  <ng-container matColumnDef="buyable">
    <mat-header-cell *matHeaderCellDef>Achetable</mat-header-cell>
    <mat-cell *matCellDef="let element">
      <mat-icon *ngIf="element.buyable" style="color: darkgreen" class="btn-green">check_circle</mat-icon>
    </mat-cell>
  </ng-container>
</app-rest-editor>


<ng-template #addDialogTemplate>
  <h2 matDialogTitle>Ajouter un upsell Premium</h2>

  <mat-dialog-content>
    <ng-container *ngTemplateOutlet="insideForm; context: {form: this.addForm, slugField: true}"></ng-container>
  </mat-dialog-content>


  <mat-dialog-actions align="end">
    <button mat-button matDialogClose>Annuler</button>
    <button mat-button matDialogClose color="primary" (click)="add()">Ajouter</button>
  </mat-dialog-actions>
</ng-template>

<ng-template #editDialogTemplate>
  <h2 matDialogTitle>Editer un upsell Premium</h2>

  <mat-dialog-content>
    <ng-container *ngTemplateOutlet="insideForm; context: {form: this.editForm, slugField: false}"></ng-container>

  </mat-dialog-content>


  <mat-dialog-actions align="end">
    <button mat-button matDialogClose>Annuler</button>
    <button mat-button matDialogClose color="primary" (click)="edit()">Editer</button>
  </mat-dialog-actions>
</ng-template>


<!-- interior -->
<ng-template #insideForm let-form="form" let-slugField="slugField">
  <form [formGroup]="form" fxLayout="column">
    <!-- name -->
    <mat-form-field>
      <input matInput placeholder="Nom" formControlName="name">
    </mat-form-field>

    <!-- slug -->
    <mat-form-field *ngIf="slugField">
      <input matInput placeholder="Url" formControlName="slug">
    </mat-form-field>

    <!-- description -->
    <mat-form-field>
      <input matInput placeholder="Description" formControlName="description">
    </mat-form-field>

    <!-- price column -->
    <mat-form-field>
      <input matInput type="number" placeholder="Prix" formControlName="price">
    </mat-form-field>

  </form>
</ng-template>
