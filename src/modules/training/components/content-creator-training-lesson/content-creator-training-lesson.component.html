<app-rest-editor [dataSource]="dataSource"
                 [policy]="policy"
                 [displayedColumns]="displayedColumns"
                 (selectedElement)="selectElement($event)"
                 (add)="startAdd()"
                 (edit)="startEdit($event)"
                 (delete)="delete($event)"
                 (move)="move($event)"
                 (visible)="visible($event)"
>
  <!-- name column -->
  <ng-container matColumnDef="name">
    <mat-header-cell *matHeaderCellDef>Nom</mat-header-cell>
    <mat-cell *matCellDef="let element"> {{element.name}} </mat-cell>
  </ng-container>

  <!-- slug column -->
  <ng-container matColumnDef="slug">
    <mat-header-cell *matHeaderCellDef>Url</mat-header-cell>
    <mat-cell *matCellDef="let element"> {{element.slug }}</mat-cell>
  </ng-container>

</app-rest-editor>


<!-- add dialog -->
<ng-template #addDialogTemplate>
  <h2 matDialogTitle>Ajouter une leçon</h2>

  <mat-dialog-content>
    <ng-container *ngTemplateOutlet="insideForm; context: {form: addForm}"></ng-container>
  </mat-dialog-content>


  <mat-dialog-actions align="end">
    <button mat-button matDialogClose>Annuler</button>
    <button mat-button matDialogClose color="primary" (click)="add()">Ajouter</button>
  </mat-dialog-actions>
</ng-template>

<!-- edit dialog -->
<ng-template #editDialogTemplate>
  <h2 matDialogTitle>Editer une leçon</h2>

  <mat-dialog-content>
    <ng-container *ngTemplateOutlet="insideForm; context: {form: editForm}"></ng-container>
  </mat-dialog-content>


  <mat-dialog-actions align="end">
    <button mat-button matDialogClose>Annuler</button>
    <button mat-button matDialogClose color="primary" (click)="edit()">Editer</button>
  </mat-dialog-actions>
</ng-template>


<!-- inside form -->
<ng-template #insideForm let-form="form">
  <form [formGroup]="form" fxLayout="column">
    <!-- name -->
    <mat-form-field>
      <input matInput placeholder="Nom" formControlName="name">
    </mat-form-field>

    <!-- slug -->
    <mat-form-field>
      <input matInput placeholder="Url" formControlName="slug">
    </mat-form-field>
  </form>
</ng-template>
