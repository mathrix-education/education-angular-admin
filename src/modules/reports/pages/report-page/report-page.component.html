<mat-card>
  <rest-editor
    [dataSource]="dataSource"
    [displayedColumns]="displayedColumns"
    [policy]="policy"
    (selectedElement)="selectElement($event)" (edit)="startEdit($event,['id','type','content','status','module_id'])"
    (add)="startAdd()" (delete)="delete($event)">
    <!-- content column -->
    <ng-container matColumnDef="content">
      <mat-header-cell *matHeaderCellDef>Rapport</mat-header-cell>
      <mat-cell *matCellDef="let element"> {{element.content}} </mat-cell>
    </ng-container>

    <!-- type column -->
    <ng-container matColumnDef="type">
      <mat-header-cell *matHeaderCellDef>Type</mat-header-cell>
      <mat-cell *matCellDef="let element"> {{element.type}} </mat-cell>
    </ng-container>

    <!-- status column -->
    <ng-container matColumnDef="status">
      <mat-header-cell *matHeaderCellDef>Etat</mat-header-cell>
      <mat-cell *matCellDef="let element"> {{element.status}} </mat-cell>
    </ng-container>

  </rest-editor>
  <mat-paginator [length]="total"
                 [pageSize]="perPage"
                 [pageSizeOptions]="pageSizeOptions"
                 (page)="changePagination($event)">
  </mat-paginator>
</mat-card>


<!-- edit dialog -->
<ng-template #editDialogTemplate>
  <h2 matDialogTitle>Editer un signalement</h2>

  <mat-dialog-content>
    <form [formGroup]="editForm" fxLayout="column">
      <!-- content -->
      <mat-form-field>
        <input matInput placeholder="Contenu du rapport" formControlName="content">
      </mat-form-field>

      <!-- status -->
      <mat-form-field>
        <mat-label>Status</mat-label>
        <mat-select matNativeControl required formControlName="status">
          <mat-option value="todo">todo</mat-option>
          <mat-option value="done">done</mat-option>
          <mat-option value="validated">validated</mat-option>
        </mat-select>
      </mat-form-field>
    </form>
  </mat-dialog-content>


  <mat-dialog-actions align="end">
    <button mat-button color="primary" matDialogClose>Annuler</button>
    <button mat-flat-button matDialogClose color="primary" (click)="edit()">Editer</button>
  </mat-dialog-actions>
</ng-template>
