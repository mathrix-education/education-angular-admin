
# Mathrix Education Angular
# =====================
options:
  machineType: 'N1_HIGHCPU_8'
timeout: '1800s'
secrets:
  - kmsKeyName: projects/mathrix-education/locations/global/keyRings/mathrix-education-keyring/cryptoKeys/npm-key
    secretEnv:
      # The npm token used to pull the packages from the GitHub NPM registry
      NPM_TOKEN: |
        CiQAOdDIsXJBjGp7OlXg5ln3SUvRMs0aUwdl5BnrUTEQZxhJ2AcSUQDeVmlYehvjujc+S5u+GWdI
        LuKGs+9L/E4flV9SJtnu/2E80/nTS7ZVJQPxgnsmHzGOoq6JMQKdBZla8qN9VbE/rGO57VIoy22+
        itviiJmliA==
steps:
  # ======================= #
  # Stage 0:                #
  # - Setup node workspace  #
  # ======================= #
  - id: 'workspace:setup'
    name: 'node:12-alpine'
    entrypoint: 'ash'
    secretEnv: ['NPM_TOKEN']
    args:
      - '-c'
      - |
        cp .npmrc .npmrc.ori
        echo "//npm.pkg.github.com/:_authToken=\$${NPM_TOKEN}" >> .npmrc
        npm install
        rm .npmrc
        mv .npmrc.ori .npmrc
  # ================================ #
  # Stage 1:                         #
  # - Build Angular Browser project  #
  # - Build Angular Server project   #
  # ================================ #
  - id: 'ng:browser'
    name: 'node:12-alpine'
    waitFor: ['workspace:setup']
    entrypoint: 'npx'
    args: ['ng', 'build', '--prod']

  # ==================================================== #
  # Stage 3:                                             #
  # - Build Docker image                                 #
  # ==================================================== #
  - id: 'docker:build'
    waitFor: ['ng:browser']
    name: 'gcr.io/cloud-builders/docker'
    args: ['build',
           '-t', 'eu.gcr.io/$PROJECT_ID/education-angular-admin:$BRANCH_NAME-$SHORT_SHA',
           '.']


  # ==================================================== #
  # Stage 4:                                             #
  # - Push Docker image to the Google Container Registry #
  # ==================================================== #
  - id: 'docker:push'
    waitFor: ['docker:build']
    name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'eu.gcr.io/$PROJECT_ID/education-angular-admin:$BRANCH_NAME-$SHORT_SHA']


  # ============================================================ #
  # Stage 5:                                                     #
  # - Deploy the newly created image to Google Cloud Run         #
  # - Add to "BRANCH-latest" tag to the newly pushed image       #
  # ============================================================ #
  - id: 'cloud-run:deploy'
    waitFor: ['docker:push']
    name: 'gcr.io/cloud-builders/gcloud'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        gcloud beta run deploy education-angular-admin-$BRANCH_NAME \
          --platform=managed \
          --image eu.gcr.io/$PROJECT_ID/education-angular-admin:$BRANCH_NAME-$SHORT_SHA \
          --region europe-west1
